[project]
name = "tongs-agents"
dynamic = ["version"]
description = "Standalone agent workspace companion app: monitor, launch and focus Claude Code, Codex and Pi sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "textual>=4,<9",
    "mcp[cli]>=1.0.0,<2",
]
authors = [
    {name = "Andre Motta"},
]
keywords = ["tongs", "agents", "claude-code", "codex", "pi", "mcp", "monitoring", "fleet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
tongs = ["tongs>=0.1"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
    "hatchling>=1.27",
    "hatch-vcs>=0.4",
]

[project.scripts]
tongs-agents = "tongs_agents.cli:main"
tongs-agents-hook = "tongs_agents.hook:main"

[project.entry-points."tongs.plugins"]
fleet-monitor = "tongs_agents.tongs_plugin:FleetMonitorPlugin"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { dist_name = "tongs-agents" }

[tool.hatch.build.hooks.vcs]
version-file = "src/tongs_agents/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tongs_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
