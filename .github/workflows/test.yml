name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feat/**'
  workflow_call:

permissions:
  contents: read

concurrency:
  # A fixed prefix: in a called workflow github.workflow names the caller,
  # so the three gates called by publish.yml would cancel each other.
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Validate headless TUI journey
        run: python validation/tui.py

  tongs-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install package with dev and tongs dependencies
        run: pip install -e ".[dev,tongs]"

      - name: Run tests with the tongs plugin installed
        run: pytest -v

  lowest-textual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install package with the lowest supported textual
        run: |
          pip install -e ".[dev]" "textual==4.0.0"
          python -c 'import textual; print("textual", textual.__version__)'

      - name: Run tests with the lowest supported textual
        run: pytest -v

      - name: Validate headless TUI journey
        run: python validation/tui.py

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download and verify actionlint
        run: |
          set -euo pipefail
          archive='actionlint_1.7.12_linux_amd64.tar.gz'
          url='https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          expected_sha256='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          tool_dir="$RUNNER_TEMP/actionlint"
          archive_path="$tool_dir/$archive"
          mkdir -p "$tool_dir"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 120 \
            --proto '=https' \
            --tlsv1.2 \
            --output "$archive_path" \
            "$url"
          test -s "$archive_path"
          actual_sha256="$(sha256sum "$archive_path" | awk '{print $1}')"
          test "$actual_sha256" = "$expected_sha256"
          tar -xzf "$archive_path" -C "$tool_dir" actionlint
          actionlint="$tool_dir/actionlint"
          test -x "$actionlint"
          "$actionlint" -version

      - name: Lint workflow files
        run: |
          set -euo pipefail
          actionlint="$RUNNER_TEMP/actionlint/actionlint"
          workflow_dir="$GITHUB_WORKSPACE/.github/workflows"
          workflows=("$workflow_dir"/*.yml)
          test -e "${workflows[0]}"
          "$actionlint" \
            -no-color \
            -shellcheck= \
            -pyflakes= \
            "${workflows[@]}"
