name: tmux multiplexer validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feat/**'
  workflow_call:

permissions:
  contents: read

concurrency:
  # A fixed prefix: in a called workflow github.workflow names the caller.
  group: tmux-mux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tmux-workspace-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tmux from apt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tmux

      - name: Record checkout and tmux metadata
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/tmux-workspace-validation"
          mkdir -p "$evidence_dir"
          {
            printf 'checkout_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'checkout_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'tmux_path=%s\n' "$(command -v tmux)"
            printf 'tmux_version=%s\n' "$(tmux -V)"
            printf 'tmux_package=%s\n' "$(dpkg-query -W -f='${Package} ${Version}' tmux)"
            printf 'kernel_release=%s\n' "$(uname -r)"
            printf 'intended_tmux_process=real tmux servers on private sockets\n'
            printf 'intended_agents=fake REPL fixtures with bracketed paste\n'
            printf 'observed_outcomes=evidence.json, diagnostics.txt and validator-exit-code.txt\n'
          } > "$evidence_dir/metadata.txt"
          printf 'tmux under test: %s\n' "$(tmux -V)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Run the tmux workspace validator
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/tmux-workspace-validation"
          status=0
          python validation/tmux_workspace.py --no-write \
            > "$evidence_dir/evidence.json" \
            2> "$evidence_dir/diagnostics.txt" || status=$?
          printf '%s\n' "$status" > "$evidence_dir/validator-exit-code.txt"
          printf 'validator_exit_code=%s\n' "$status" >> "$evidence_dir/metadata.txt"
          printf 'tmux workspace validator exit code: %s\n' "$status" >> "$GITHUB_STEP_SUMMARY"
          test "$status" -eq 0

      - name: Upload tmux validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tmux-workspace-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tmux-workspace-validation/
          if-no-files-found: error
          retention-days: 7
